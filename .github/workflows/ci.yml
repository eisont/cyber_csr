name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: node -v && npm -v

      - name: Debug yaml requirements in lock
        run: |
          node -e "const fs=require('fs'); const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); const pkgs=lock.packages||{}; const fields=['dependencies','optionalDependencies','peerDependencies','devDependencies']; const users=[]; let yaml=pkgs['node_modules/yaml']; console.log('yaml in lock:', yaml && yaml.version); for (const [p,m] of Object.entries(pkgs)) { for (const f of fields) { const d=(m&&m[f])||{}; if (d.yaml) users.push({pkg:p, field:f, range:d.yaml}); } } console.log('yaml users:', users.length); console.log(users);"
          grep -n "\"yaml\": \"2.8.2\"" package-lock.json || true
          grep -n "yaml@2.8.2" package-lock.json || true

      - name: Install dependencies
        run: npm ci

      # 1) 공통: ESLint
      - name: Run ESLint
        run: npm run lint

      # 2) 공통: Prettier 포맷 체크
      - name: Run Prettier check
        run: npm run format:check

      # 3) 공통: 타입 체크 (TS)
      - name: Run TypeScript type-check
        run: npm run type-check

      # 4) main에서만 테스트 실행
      # - name: Run tests (main only)
      #   if: |
      #     github.ref == 'refs/heads/main' ||
      #     github.base_ref == 'main'
      #   run: npm run test:run

      # 5) main에서만 빌드 실행
      - name: Build project (main only)
        if: |
          github.ref == 'refs/heads/main' ||
          github.base_ref == 'main'
        run: npm run build
